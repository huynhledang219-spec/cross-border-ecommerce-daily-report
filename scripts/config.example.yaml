# Keep runtime data outside this Skill directory.
output_dir: ../../runtime/reports
profile_dir: ../../runtime/browser-profile
template_path: ../assets/report-template.xlsx
detail_limit: 20
trend_days: 7
pages_per_category: 10

# EchoTik is the default registered product-intelligence platform.
# Sign in manually in the isolated browser profile the first time Chrome opens.
# A replacement requires a tested registered adapter and the equivalent-capability gate.
# Before adding an EchoTik category, confirm its full path and ID on a visible page.
primary_platform:
  adapter: echotik
  categories:
    - path: ["宠物用品", "猫狗配件", "猫狗清洁美容"]
      id: "816392"
    - path: ["宠物用品", "猫狗配件", "猫狗服饰"]
      id: "813960"
  options: {}

# Amazon remains a required supplementary source. Confirm every category URL visibly.
amazon_categories:
  - name: Pet Grooming Supplies
    url: https://www.amazon.com/s?k=pet+grooming+supplies&i=pets
  - name: Pet Clothing & Accessories
    url: https://www.amazon.com/s?k=pet+clothing+accessories&i=pets
